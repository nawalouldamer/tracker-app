<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Space</title>
<style>
/* Layout: same calm single-column workspace as v1 — header, tab bar, one screen; two-column split collapses on phones. */
:root{--bg:#ffffff;--fg:#1a1a1a;--surface:#f8f9fa;--surface2:#eff0f2;--field:#ffffff;--border:#e0e1e4;--muted:#80838a;--accent:#000000;--on-accent:#ffffff;--green:#4caf50;--amber:#b7791f;--amber-bg:#fdf6e7;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121315;--fg:#ececee;--surface:#1a1b1e;--surface2:#25272b;--field:#141518;--border:#303237;--muted:#9a9ca3;--accent:#f2f2f3;--on-accent:#121315;--green:#5fbf63;--amber:#e3b04b;--amber-bg:#2b2416;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121315;--fg:#ececee;--surface:#1a1b1e;--surface2:#25272b;--field:#141518;--border:#303237;--muted:#9a9ca3;--accent:#f2f2f3;--on-accent:#121315;--green:#5fbf63;--amber:#e3b04b;--amber-bg:#2b2416;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1120px;margin:auto;padding-block:30px 80px;padding-inline:22px}
.header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.header h1{font-size:28px;letter-spacing:-.035em;margin:6px 0}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.nav{display:flex;gap:5px;padding:5px;border:1px solid var(--border);border-radius:13px;background:var(--surface);margin-bottom:22px;overflow-x:auto}
.nav button{flex:1;padding:11px 12px;border:0;border-radius:9px;background:none;color:var(--muted);white-space:nowrap}
.nav button.active{background:var(--surface2);color:var(--fg);font-weight:650}
.card{background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:22px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:18px}
.stack{display:grid;gap:18px;align-content:start;min-width:0}
h2{font-size:19px;margin:0 0 9px;letter-spacing:-.02em;text-wrap:balance}h3{font-size:16px;margin:0 0 8px}
p{margin:8px 0;color:var(--muted);line-height:1.55}
.small{font-size:13px;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}
.label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--border);border-radius:9px;color:var(--fg);padding:10px 12px}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;margin-top:1px}
.btn{border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--fg);padding:9px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ghost{background:transparent}.danger{color:#c0392b}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;line-height:1.4;flex:1;min-width:0}
.check span{overflow-wrap:anywhere}.stepno{color:var(--muted);font-weight:650;font-variant-numeric:tabular-nums;margin-right:7px}.check.done span{text-decoration:line-through;color:var(--muted)}
.progress{height:7px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:var(--green);transition:width .2s}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:30px;padding:5px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}
.section{margin-top:18px}.divider{border-top:1px solid var(--border);margin:20px 0}
.item{padding:15px;border:1px solid var(--border);border-radius:12px;margin-top:10px;background:var(--bg)}
.itemhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.toggle{text-align:left;flex:1;color:var(--fg);font-weight:700;border:0;background:transparent;padding:0;min-width:0}
.tasks{padding-left:11px;border-left:1px solid var(--border);margin:12px 0 0 6px}
.taskline{display:flex;align-items:center;gap:6px;min-width:0}
.tasktime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.iconbtn{border:0;background:none;color:var(--muted);padding:5px 7px;border-radius:6px;flex-shrink:0}
.iconbtn:hover{color:var(--fg);background:var(--surface2)}
.editrow{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}.editrow input,.editrow select{flex:1;min-width:140px}
.confirm{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:16px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:14px;line-height:1.5}
.idea{padding:10px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:flex-start}.idea:last-child{border:0}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.metric,.num{font-variant-numeric:tabular-nums}
.focus{background:var(--bg);border:1px solid var(--border);padding:16px;border-radius:12px;margin-top:14px;display:grid;gap:12px}
.focusClock{font-size:34px;letter-spacing:-.04em;font-weight:720;font-variant-numeric:tabular-nums;line-height:1}
.checkin{background:var(--amber-bg);border:1px solid var(--amber);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
.checkin strong{color:var(--fg)}
.fields{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--bg)}
.stat b{display:block;font-size:22px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:4px}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:170px;margin-top:14px}
.barcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bar{width:100%;max-width:46px;background:var(--surface2);border:1px solid var(--border);border-radius:7px 7px 3px 3px;position:relative;min-height:3px}
.bar.has{background:var(--green);border-color:var(--green)}.bar.today{outline:2px solid var(--accent);outline-offset:2px}
.barval{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.barlbl{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:7px 0}
.hbar .track{grid-column:1/-1;height:6px;background:var(--surface2);border-radius:10px;overflow:hidden}
.hbar .track div{height:100%;background:var(--green);border-radius:10px}
.hbar .name{font-size:14px;overflow-wrap:anywhere}
.loggroup{margin-top:14px}.loggroup h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:650}
.logline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.logline:last-child{border:0}.logline .when{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px;padding-top:1px}
.daylist{display:grid;gap:4px;max-height:360px;overflow:auto;margin-top:10px}
.dayitem{text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;display:grid;gap:2px}
.dayitem:hover{background:var(--surface2)}.dayitem.active{border-color:var(--border);background:var(--bg)}
.dayitem .d{font-weight:650;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.dayitem .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weeknav{display:flex;align-items:center;gap:6px}
.mstabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick{display:flex;flex-wrap:wrap;gap:8px}.timeline{display:grid}
.tl{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}.tl:last-child{border:0}
.tl .when{font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600;width:44px;flex-shrink:0;padding-top:1px}
.mark{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--accent)}
.tl.auto .mark,.mark.auto{background:transparent;border:1.5px solid var(--muted)}.tl.auto .grow,.tl.auto .when{color:var(--muted);font-weight:400}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}.legend>span{display:inline-flex;align-items:center;gap:6px}.legend .mark{margin-top:0}
.wtable{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.wtable th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 6px 6px 0;border-bottom:1px solid var(--border)}
.wtable td{padding:7px 6px 7px 0;border-bottom:1px solid var(--border);white-space:nowrap}.wtable tr.cur td{font-weight:650}
.linkbtn{border:0;background:none;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}.linkbtn:disabled{color:var(--muted);text-decoration:none;cursor:default}
.btn:disabled{opacity:.4;cursor:default}
.modes{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px;background:var(--bg);max-width:100%}
.modes button{border:0;background:none;padding:9px 20px;border-radius:9px;font-weight:650;color:var(--muted)}.modes button.active{background:var(--accent);color:var(--on-accent)}
.wtable tfoot td{font-weight:650;border-bottom:0;border-top:1.5px solid var(--border);color:var(--muted)}
.hero{padding:8px 0 28px}.mottorow{display:flex;align-items:flex-start;gap:6px}.mottorow .iconbtn{margin-top:8px;opacity:.6}.mottorow .iconbtn:hover{opacity:1}
.motto{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:46px;line-height:1.12;letter-spacing:-.02em;font-weight:600;margin:0;max-width:24ch;text-wrap:balance}
.heroline{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-top:14px}.heroline .bigdate2{margin:0}.bigdate{font-size:46px;font-weight:760;letter-spacing:-.045em;line-height:1.05}.bigdate2{font-size:20px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.qitem{margin:0;padding:14px 0;border-bottom:1px solid var(--border)}.qitem:last-of-type{border-bottom:0;padding-bottom:4px}.qcat{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}
.quote blockquote{margin:6px 0 6px;font-size:17.5px;line-height:1.45;letter-spacing:-.01em;font-family:Georgia,'Iowan Old Style','Times New Roman',serif;text-wrap:pretty}
@media(max-width:760px){.motto{font-size:32px}.bigdate{font-size:36px}.bigdate2{font-size:17px}}
#titleBlock[hidden]+div{margin-left:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--border);background:var(--bg);border-radius:30px;padding:6px 12px;font-size:13px;color:var(--muted);font-weight:600}.chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.chip.small{padding:4px 10px;font-size:12px}
.plist{display:grid;gap:8px}.prow{display:grid;gap:4px;text-align:left;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:13px 15px;width:100%;color:var(--fg)}.prow:hover{border-color:var(--accent)}
.ptitle{font-weight:680;font-size:15px;line-height:1.35;overflow-wrap:anywhere}.pmeta{font-size:13px;color:var(--muted)}.pinfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.passes{display:inline-flex;gap:3px}.passes i{font-style:normal;font-size:11px;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);display:inline-grid;place-items:center;color:var(--muted)}.passes i.on{background:var(--green);border-color:var(--green);color:#fff}
.tag{font-size:12px;color:var(--muted)}.stars{display:inline-flex}.star{border:0;background:none;font-size:20px;color:var(--border);padding:2px 3px;line-height:1}.star.on{color:var(--amber)}
.pass.done{border-color:var(--green)}.qrow{padding:4px 0 10px;border-bottom:1px solid var(--border)}.qrow:last-of-type{border-bottom:0}
input.qans{font-size:13px;padding:7px 10px;margin-left:27px;width:calc(100% - 27px)}a.btn{text-decoration:none}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;left:auto;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:10px;max-width:min(340px,calc(100vw - 40px));font-size:14px;z-index:5}
.hidden{display:none!important}[hidden]{display:none!important}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--surface2);padding:1px 5px;border-radius:5px}a{color:var(--fg)}
@media(max-width:760px){.split{grid-template-columns:1fr}.app{padding-block:20px 60px;padding-inline:16px}.header h1{font-size:24px}.card{padding:17px}.nav button{font-size:13px;padding:10px 9px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.bars{height:140px;gap:5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<main class="app">
<header class="header">
  <div id="titleBlock"><div class="eyebrow" id="eyebrow" hidden></div><h1 id="pageTitle">Research</h1><div class="sub" id="sub">One question at a time. Evidence over hours.</div></div>
  <div class="row wrap">
    <button type="button" class="pill" id="syncStatus" style="background:none;cursor:pointer"><span class="dot" id="syncDot"></span><span id="syncText">Not synced · click to connect</span></button>
    <button class="btn ghost" id="export" type="button">Export backup</button>
    <label class="btn ghost" for="import">Import</label><input type="file" id="import" class="hidden" accept="application/json">
  </div>
</header>
<div class="modes" aria-label="Area"><button type="button" data-mode="home">Home</button><button type="button" data-mode="research">Research</button><button type="button" data-mode="papers">Papers</button><button type="button" data-mode="log">Day Log</button></div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div id="screen"></div>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(()=>{'use strict';
const LS='research-space-v2', CID=Math.random().toString(36).slice(2);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const dateKey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function weekKey(d=new Date()){let t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()+4-(t.getDay()||7));let y=t.getFullYear(),a=new Date(y,0,1);return y+'-W'+pad(Math.ceil((((t-a)/86400000)+1)/7))}
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const prettyDay=k=>parseKey(k).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
function dur(ms){const m=Math.round(Math.max(0,ms)/60000),h=Math.floor(m/60);return h?h+'h '+pad(m%60)+'m':m+'m'}
function clock(ms){const s=Math.floor(Math.max(0,ms)/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)}

/* ---------- data ---------- */
const seedMilestone=()=>({id:'m1',name:'Milestone 1 — Example milestone',objective:'Replace this with what you want to learn or deliver. Import a milestone from Markdown, or edit this one.',archived:false,packages:[{id:'getting-started',name:'Getting started',tasks:[{id:'ex-objective',name:'Write the objective of your milestone',done:false},{id:'ex-package',name:'Add your first real work package',done:false},{id:'ex-focus',name:'Start a focus session on one step',done:false}]}]});
const blankWeek=()=>({direction:'',completed:'',learned:'',blocked:'',next:'',priorities:[]});
const blankDay=()=>({outcome:'',findings:'',blocker:'',next:'',notes:'',selected:[],sessions:[],log:[],todos:[]});
const seed=()=>({version:2,milestones:[seedMilestone()],activeMilestoneId:'m1',activeTaskId:'ex-objective',weeks:{},days:{},ideas:[],expanded:['getting-started'],settings:{checkIn:45},running:null});
const normDay=d=>({...blankDay(),...d,selected:Array.isArray(d.selected)?d.selected:[],sessions:Array.isArray(d.sessions)?d.sessions:[],log:Array.isArray(d.log)?d.log:[],todos:Array.isArray(d.todos)?d.todos:[]});
function normalize(s){
  if(!s||typeof s!=='object')throw Error('bad');
  if(s.version===1){ // convert a v1 backup
    const wk=weekKey(),weeks={};Object.entries(s.weeks||{}).forEach(([k,w])=>weeks[k]={...blankWeek(),...w,priorities:[]});
    weeks[wk]={...(weeks[wk]||blankWeek()),priorities:s.weeklyPriorityIds||[]};
    const m={id:'m-'+uid(),archived:false,...s.milestone};
    s={version:2,milestones:[m],activeMilestoneId:m.id,activeTaskId:s.activeTaskId,weeks,days:s.days||{},ideas:s.ideas||[],expanded:s.expanded||[],settings:{checkIn:45},running:null};
  }
  if(s.version!==2||!Array.isArray(s.milestones)||!s.milestones.length)throw Error('bad');
  s.weeks=s.weeks||{};Object.keys(s.weeks).forEach(k=>s.weeks[k]={...blankWeek(),...s.weeks[k]});
  s.days=s.days||{};Object.keys(s.days).forEach(k=>s.days[k]=normDay(s.days[k]));
  s.ideas=s.ideas||[];s.papers=Array.isArray(s.papers)?s.papers:[];s.deletedPapers=s.deletedPapers||[];s.papers.forEach(p=>{p.questions=Array.isArray(p.questions)?p.questions:[]});s.expanded=s.expanded||[];s.settings={checkIn:45,...(s.settings||{})};s.running=s.running||null;
  if(!s.milestones.find(m=>m.id===s.activeMilestoneId))s.activeMilestoneId=s.milestones[0].id;
  return s;
}
let state;try{state=normalize(JSON.parse(localStorage.getItem(LS)))}catch{state=seed()}

/* ---------- lookups ---------- */
const activeMs=()=>state.milestones.find(m=>m.id===state.activeMilestoneId)||state.milestones[0];
const tasksOf=m=>m.packages.flatMap((p,pi)=>p.tasks.map((t,ti)=>({...t,num:(pi+1)+'.'+(ti+1),packageId:p.id,packageName:p.name,milestoneId:m.id,milestoneName:m.name})));
const allTasks=()=>state.milestones.flatMap(tasksOf);
const activeTasks=()=>tasksOf(activeMs());
const task=id=>allTasks().find(t=>t.id===id);
const rawTask=id=>{for(const m of state.milestones)for(const p of m.packages){const t=p.tasks.find(t=>t.id===id);if(t)return t}};
const day=k=>state.days[k]||(state.days[k]=blankDay());
const week=k=>state.weeks[k]||(state.weeks[k]=blankWeek());
const dayHas=d=>!!d&&(d.outcome||d.findings||d.blocker||d.next||d.notes||d.sessions.length||d.log.length||d.todos.length);
const dayMs=k=>(state.days[k]?.sessions||[]).reduce((a,s)=>a+s.ms,0);
const weekDays=off=>{const m=addDays(mondayOf(new Date()),off*7);return [...Array(7)].map((_,i)=>dateKey(addDays(m,i)))};
const taskMs=id=>Object.values(state.days).reduce((a,d)=>a+d.sessions.filter(s=>s.taskId===id).reduce((b,s)=>b+s.ms,0),0);
const progress=ts=>ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0;

/* ---------- ui state ---------- */
let tab='today', weekOff=0, journalDate=dateKey(), logDay=null;
const modeFromHash=()=>({'#log':'log','#research':'research','#papers':'papers'})[location.hash]||'home';let mode=modeFromHash();const lastTab={home:'home',research:'today',papers:'library',log:'daylog'};tab=lastTab[mode];
let edit=null, confirmDel=null, ackCount=0, chimed=-1, audio=null, pendingRender=false;

/* ---------- saving & GitHub sync ---------- */
const CFG='research-space-github', DIRTY=LS+':dirty';
let gh=(()=>{try{return JSON.parse(localStorage.getItem(CFG))||null}catch{return null}})();
let ghSha=null, dirty=(()=>{try{return localStorage.getItem(DIRTY)==='1'}catch{return false}})(), pushTimer=0, busy=false, lastSync=0, repoPrivate=null, syncErr='';
function setSync(mode){const t={local:['Not synced · click to connect',''],pending:['Changes waiting to sync','warn'],syncing:['Syncing…','warn'],synced:['Synced to GitHub','ok'],offline:['Sync failed · saved on this device','warn']}[mode];$('syncText').textContent=t[0];$('syncDot').className='dot '+t[1]}
function setDirty(v){dirty=v;try{localStorage.setItem(DIRTY,v?'1':'0')}catch{}}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(state))}catch{}}
function commit(paths){const now=Date.now();paths.forEach(p=>{if(p==='main')state.updated=now;else if(p.startsWith('paper:')){const x=paper(p.slice(6));if(x)x.updated=now}else if(state.days[p.slice(4)])state.days[p.slice(4)].updated=now});localSave();setDirty(true);if(gh){setSync('pending');schedule()}}
const D=k=>'day:'+k;
function schedule(ms=15000){clearTimeout(pushTimer);pushTimer=setTimeout(push,ms)}
const b64e=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const api=(p,opt={})=>fetch('https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/'+encodeURIComponent(gh.repo)+p,{cache:'no-store',...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+gh.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
const filePath=()=>'/contents/'+gh.path.split('/').map(encodeURIComponent).join('/');
async function ghErr(r){const m={401:'GitHub rejected the token. It may have expired or been pasted incorrectly.',403:'The token cannot write to this repo. It needs Contents: Read and write.',404:'Repo, branch or file not found, or the token cannot see this repo.'}[r.status];let extra='';try{extra=(await r.json()).message||''}catch{}return Error(m||('GitHub error '+r.status+(extra?': '+extra:'')))}
async function pull(){const r=await api(filePath()+'?ref='+encodeURIComponent(gh.branch));if(r.status===404){ghSha=null;return null}if(!r.ok)throw await ghErr(r);const j=await r.json();ghSha=j.sha;if(!j.content)throw Error('The data file is over 1 MB. Export a backup and ask for a split-file version.');return normalize(JSON.parse(b64d(j.content)))}
function merge(a,b){const newer=(b.updated||0)>(a.updated||0)?b:a,older=newer===a?b:a,out=clone(newer);
  const ids=new Set(out.ideas.map(i=>i.id));older.ideas.forEach(i=>{if(!ids.has(i.id))out.ideas.push(i)});
  out.days={};new Set([...Object.keys(a.days),...Object.keys(b.days)]).forEach(k=>{const x=a.days[k],y=b.days[k];if(!x||!y){out.days[k]=clone(x||y);return}
    const n=(y.updated||0)>(x.updated||0)?y:x,o=n===x?y:x,d=clone(n),s=new Set(d.sessions.map(q=>q.id));o.sessions.forEach(q=>{if(!s.has(q.id))d.sessions.push(clone(q))});d.sessions.sort((p,q)=>p.start-q.start);const li=new Set(d.log.map(q=>q.id));o.log.forEach(q=>{if(!li.has(q.id))d.log.push(clone(q))});const ti=new Set(d.todos.map(q=>q.id));o.todos.forEach(q=>{if(!ti.has(q.id))d.todos.push(clone(q))});out.days[k]=d});
  const del=new Set([...(a.deletedPapers||[]),...(b.deletedPapers||[])]),pm={};[...(older.papers||[]),...(newer.papers||[])].forEach(p=>{const e=pm[p.id];if(!e||(p.updated||0)>=(e.updated||0))pm[p.id]=clone(p)});out.papers=Object.values(pm).filter(p=>!del.has(p.id)).sort((x,y)=>(y.added||0)-(x.added||0));out.deletedPapers=[...del];
  return normalize(out)}
async function push(keepalive=false){if(!gh||busy)return;busy=true;clearTimeout(pushTimer);setSync('syncing');
  try{for(let i=0;i<3;i++){const sent=JSON.stringify(state,null,1),body={message:'Research Space update '+dateKey()+' '+hm(Date.now()),content:b64e(sent),branch:gh.branch};if(ghSha)body.sha=ghSha;
      const r=await api(filePath(),{method:'PUT',body:JSON.stringify(body),keepalive:keepalive&&body.content.length<60000});
      if(r.ok){const j=await r.json();ghSha=j.content.sha;if(JSON.stringify(state,null,1)===sent)setDirty(false);lastSync=Date.now();syncErr='';setSync(dirty?'pending':'synced');break}
      if(r.status===409||r.status===422){const remote=await pull();if(remote){state=merge(state,remote);syncAck();localSave();softRender()}if(i===2)throw await ghErr(r);continue}
      throw await ghErr(r)}}
  catch(e){syncErr=e.message||'Could not reach GitHub.';setSync('offline')}
  busy=false;if(tab==='sync')softRender();if(dirty&&!syncErr)schedule()}
async function refresh(){if(!gh||busy||dirty)return;busy=true;try{const remote=await pull();if(remote&&(remote.updated||0)!==(state.updated||0)||remote&&JSON.stringify(remote.days)!==JSON.stringify(state.days)||remote&&JSON.stringify(remote.papers)!==JSON.stringify(state.papers)){state=remote;syncAck();localSave();softRender()}lastSync=Date.now();syncErr='';setSync('synced')}catch(e){syncErr=e.message;setSync('offline')}busy=false}
async function initialSync(){if(!gh){setSync('local');return}setSync('syncing');busy=true;let remote;
  try{remote=await pull()}catch(e){busy=false;syncErr=e.message;setSync('offline');return}
  if(remote){state=dirty?merge(state,remote):remote;syncAck();localSave();render()}
  busy=false;lastSync=Date.now();syncErr='';if(dirty||!remote){setDirty(true);push()}else setSync('synced');loadRepoQuotes()}
async function loadRepoQuotes(){if(!gh)return;try{const r=await api('/contents/quotes.md?ref='+encodeURIComponent(gh.branch));if(!r.ok)return;const j=await r.json();if(!j.content)return;const q=parseQuotes(b64d(j.content));if(!q.length)return;const src='quotes.md in your repo';if(JSON.stringify(q)!==JSON.stringify(state.settings.fileQuotes||null)||state.settings.quotesSource!==src){state.settings.fileQuotes=q;state.settings.quotesSource=src;quoteOverride=null;commit(['main']);if(tab==='home')softRender()}}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(dirty)push()}else refresh()});
window.addEventListener('pagehide',()=>{if(dirty)push(true)});
setInterval(()=>{if(!document.hidden)refresh()},90000);
async function connectGh(){const v=id=>($(id)?.value||'').trim();
  const cfg={owner:v('ghOwner'),repo:v('ghRepo').replace(/\.git$/,''),branch:v('ghBranch')||'main',path:v('ghPath')||'research-space-data.json',token:v('ghToken')||gh?.token||''};
  if(!cfg.owner||!cfg.repo||!cfg.token){notify('Fill in owner, repository and token.');return}
  const prev=gh;gh=cfg;syncErr='';
  try{const r=await api('');if(!r.ok)throw await ghErr(r);const j=await r.json();repoPrivate=!!j.private;
    if(!j.permissions?.push&&j.permissions)throw Error('This token can read the repo but cannot write to it. Give it Contents: Read and write.')}
  catch(e){gh=prev;syncErr=e.message||'Could not reach GitHub.';render();return}
  try{localStorage.setItem(CFG,JSON.stringify(gh))}catch{}
  ghSha=null;setDirty(true);await initialSync();tab='sync';render();notify(repoPrivate?'Connected. Your data now syncs through GitHub.':'Connected, but the repo is public. Make it private.')}


function notify(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>el.hidden=true,2800)}
function typing(){const a=document.activeElement;return a&&$('screen').contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&/text|number|date/.test(a.type)))}
function softRender(){if(typing())pendingRender=true;else render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!typing()){pendingRender=false;render()}},0));

/* ---------- small render helpers ---------- */
const taskCheck=(t,num=t.num)=>`<label class="check ${t.done?'done':''}"><input type="checkbox" data-check="${esc(t.id)}" ${t.done?'checked':''}><span>${num?`<b class="stepno">${num}</b>`:''}${esc(t.name)}</span></label>`;
const byOrder=(a,b)=>{const [a1,a2]=a.num.split('.').map(Number),[b1,b2]=b.num.split('.').map(Number);return a1-b1||a2-b2};
const taskOptions=(list,sel,blank)=>(blank?`<option value="">${blank}</option>`:'')+list.map(t=>`<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.num+'  '+t.name+'  ('+t.packageName+')')}</option>`).join('');
const delBtn=(kind,id,title='Delete')=>confirmDel&&confirmDel.kind===kind&&confirmDel.id===id
  ?`<span class="confirm">Delete?<button class="btn danger" type="button" data-act="del-yes">Yes</button><button class="btn ghost" type="button" data-act="del-no">No</button></span>`
  :`<button class="iconbtn" type="button" data-act="ask-del" data-kind="${kind}" data-id="${esc(id)}" title="${title}" aria-label="${title}">×</button>`;
const isEditing=(kind,id)=>edit&&edit.kind===kind&&edit.id===id;
const editField=(val)=>`<div class="editrow grow" style="margin:0"><input type="text" id="editInput" value="${esc(val)}"><button class="btn primary" type="button" data-act="save-edit">Save</button><button class="btn ghost" type="button" data-act="cancel-edit">Cancel</button></div>`;
const weekLabel=off=>off===0?'This week':off===-1?'Last week':off===1?'Next week':weekKey(addDays(mondayOf(new Date()),off*7));
const weekNav=()=>`<div class="weeknav"><button class="btn ghost" type="button" data-act="wk-prev" aria-label="Previous week">‹</button><span class="pill num" style="min-width:96px;justify-content:center">${weekLabel(weekOff)}</span><button class="btn ghost" type="button" data-act="wk-next" aria-label="Next week">›</button>${weekOff?'<button class="btn ghost" type="button" data-act="wk-now">Today</button>':''}</div>`;

/* ---------- TODAY ---------- */
function focusPanel(){
  const r=state.running;
  if(!r) return `<div class="row wrap section"><button class="btn primary" type="button" data-act="start">Start focus session</button>
    <label class="row small" for="checkIn" style="gap:8px">Check in every <select id="checkIn" style="width:auto">${[0,25,45,60,90].map(m=>`<option value="${m}" ${state.settings.checkIn===m?'selected':''}>${m?m+' min':'never'}</option>`).join('')}</select></label></div>`;
  const t=task(r.taskId),el=Date.now()-r.start,iv=state.settings.checkIn*60000,due=iv?Math.floor(el/iv):0;
  return `<div class="focus"><div class="row between wrap"><div><div class="small">Focus session · started ${hm(r.start)}</div><div class="small" style="color:var(--fg);margin-top:3px">${esc(r.paperId?'Reading · '+(paper(r.paperId)?.title||'paper'):t?t.name:'No task selected')}</div></div><div class="focusClock" id="focusClock">${clock(el)}</div></div>
  ${iv&&due>ackCount?`<div class="checkin"><div><strong>${dur(due*iv)} in.</strong> <span class="small">Natural checkpoint: keep going, change approach, or stop? Drink some water either way.</span></div><div class="row wrap"><button class="btn" type="button" data-act="ack">Keep going</button><button class="btn" type="button" data-act="end">Stop and log it</button></div></div>`:''}
  <label><span class="label">What did this session produce? (optional)</span><textarea id="runNote" data-field="run:note" style="min-height:60px" placeholder="e.g. confirmed labels are -100 on prompt tokens">${esc(r.note||'')}</textarea></label>
  <div class="row wrap"><button class="btn primary" type="button" data-act="end">End and log session</button><button class="btn ghost" type="button" data-act="discard">Discard</button></div></div>`;
}

/* ---------- RESEARCH MAP ---------- */

  return `<div class="stack"><div class="card"><div class="mstabs"><label class="label" for="msSelect" style="margin:0">Milestone</label><select id="msSelect" style="width:auto;max-width:100%;flex:1">${live.map(x=>`<option value="${esc(x.id)}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}${arch.length?`<optgroup label="Archived">${arch.map(x=>`<option value="${esc(x.id)}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`:''}</select>

/* ---------- TIME ---------- */
function timeView(){
  const keys=weekDays(weekOff),tk=dateKey(),totals=keys.map(dayMs),wt=totals.reduce((a,b)=>a+b,0),worked=totals.filter(Boolean).length,max=Math.max(...totals,3600000);
  const ses=keys.flatMap(k=>(state.days[k]?.sessions||[]).map(s=>({...s,date:k})));

  const rows=Object.entries(byTask).sort((a,b)=>b[1]-a[1]),tmax=rows[0]?.[1]||1;
  const all=allTasks().filter(t=>!state.milestones.find(m=>m.id===t.milestoneId).archived);
  return `<div class="stack"><div class="card"><div class="row between wrap"><div><div class="eyebrow">Time log</div><h2 style="margin-top:7px">Where your hours went</h2></div>${weekNav()}</div>

    <div class="stat"><span class="small">Sessions</span><b>${ses.length}</b></div></div>
  <div class="bars" role="img" aria-label="Focus time per day">${keys.map((k,i)=>`<div class="barcol"><span class="barval">${totals[i]?dur(totals[i]):''}</span><div class="bar ${totals[i]?'has':''} ${k===tk?'today':''}" style="height:${Math.max(2,totals[i]/max*100)}%"></div><span class="barlbl">${DOW[i]}<br>${parseKey(k).getDate()}</span></div>`).join('')}</div>
  <p class="hint">Bars show logged focus time. Rest days are part of the work.</p></div>
  <div class="split"><section class="card"><h3>Time by task</h3>
  ${rows.length?rows.map(([id,ms])=>{const pp=String(id).startsWith('paper:')?paper(id.slice(6)):null,t=pp?{name:'Reading · '+pp.title,packageName:'Paper'}:task(id);return `<div class="hbar"><span class="name">${esc(t?t.name:'Deleted step')}${t?`<span class="small"> · ${esc(t.packageName)}</span>`:''}</span><span class="tasktime">${dur(ms)}</span><div class="track"><div style="width:${ms/tmax*100}%"></div></div></div>`}).join(''):'<div class="empty">No time logged in this week.</div>'}
  <div class="divider"></div><h3>Session log</h3>

const stripNum=s=>s.replace(/^\d+(\.\d+)*[.)]?\s+/,'').trim();
function parseMilestone(text){
  text=(text||'').trim();if(!text)throw Error('it is empty.');
  if(text[0]==='{'){const j=JSON.parse(text),m=j.milestones?j.milestones[0]:(j.milestone||j);
    if(!m||!Array.isArray(m.packages))throw Error('this JSON has no "packages" list.');
    const packages=m.packages.map(p=>({name:stripNum(String(p.name||'Work package')),tasks:(p.tasks||[]).map(t=>typeof t==='string'?{name:stripNum(t),done:false}:{name:stripNum(String(t.name||'')),done:!!t.done}).filter(t=>t.name)}));
    return {name:String(m.name||'Imported milestone'),objective:String(m.objective||''),packages}}
  let name='',obj=[],packages=[],cur=null,mm;
  for(const raw of text.split(/\r?\n/)){const l=raw.trim();if(!l)continue;
    if((mm=l.match(/^#(?!#)\s*(.+)/))&&!name&&!packages.length){name=mm[1].trim();continue}
    if((mm=l.match(/^#{1,6}\s*(.+)/))){cur={name:stripNum(mm[1])||'Work package',tasks:[]};packages.push(cur);continue}
    if((mm=l.match(/^(?:[-*+•]|\d+(?:\.\d+)*[.)]?)\s+(?:\[( |x|X)\]\s*)?(.+)/))){if(!cur){cur={name:'Steps',tasks:[]};packages.push(cur)}const n=stripNum(mm[2]);if(n)cur.tasks.push({name:n,done:/x/i.test(mm[1]||'')});continue}
    if(!packages.length)obj.push(l)}
  if(!packages.length)throw Error('no work packages or steps found. Use "## Package" lines and "- step" lines.');
  return {name:name||'Imported milestone',objective:obj.join(' '),packages}}
function importInfo(){if(!importText.trim())return 'Paste or load a plan to see a preview.';
  try{const p=parseMilestone(importText),n=p.packages.reduce((a,x)=>a+x.tasks.length,0);return `Ready: “${p.name}” · ${p.packages.length} work package${p.packages.length>1?'s':''} · ${n} step${n===1?'':'s'}`}
  catch(e){return 'Not readable yet: '+(e.message||'check the format.')}}
function msToMd(m){return `# ${m.name}\n${m.objective?m.objective+'\n':''}\n`+m.packages.map(p=>`## ${p.name}\n`+p.tasks.map(t=>`- ${t.done?'[x] ':''}${t.name}`).join('\n')).join('\n\n')+'\n'}

function parseQuotes(text){const out=[];let cat='';
  for(const raw of String(text).split(/\r?\n/)){let l=raw.trim();if(!l||/^(-{3,}|\*{3,}|_{3,})$/.test(l))continue;
    const h=l.match(/^#{2,6}\s*(.+)$/);if(h){cat=h[1].replace(/^\d+[.)]\s*/,'').trim();continue}
    if(/^#/.test(l))continue;l=l.replace(/^>\s*/,'');
    const ao=l.match(/^(?:[—–]|--)\s*(.+)$/);if(ao&&out.length&&!out[out.length-1][1]){out[out.length-1][1]=ao[1].trim();continue}
    l=l.replace(/^(?:[-*+•]|\d+[.)])\s+/,'').trim();if(!l)continue;
    let q=l,a='',m=l.match(/^(.*\S)\s+[—–~]\s+(.+)$/)||l.match(/^(.*\S)\s+--?\s+([^-]{1,60})$/);
    if(m&&m[2].trim().split(/\s+/).length<=7){q=m[1];a=m[2].trim()}
    q=q.trim().replace(/^["“”'‘’]+|["“”'‘’]+$/g,'').trim();if(q.length>1)out.push([q,a,cat])}
  return out}
function quoteSrc(){const n=(state.settings.fileQuotes||[]).length,own=(state.settings.quotes||[]).length;
  return n?`${n} quotes from ${esc(state.settings.quotesSource||'your file')}${own?' + '+own+' of your own':''} · <button class="linkbtn" type="button" data-act="quotes-builtin">use built-in quotes</button>`
    :`Built-in quotes${own?' + '+own+' of your own':''}. Load a .md file${typeof syncView==='function'?', or add quotes.md to your data repo,':''} to use your own list.`}
function quotesFor(k){const fq=state.settings.fileQuotes||[];
  const all=[...(fq.length?fq:QUOTES).map(q=>({t:q[0],a:q[1]&&q[1]!=='Unknown'?q[1]:'',c:q[2]||''})),...(state.settings.quotes||[]).map(q=>({t:q.text,a:q.author&&q.author!=='Me'?q.author:'',c:'My own words'}))];
  if(!all.length)return [];const n=Math.floor(parseKey(k).getTime()/86400000)+quoteShift,cats=[...new Set(all.map(q=>q.c))];
  if(cats.length<2){const out=[];for(let i=0;i<Math.min(3,all.length);i++)out.push(all[((n*3+i)%all.length+all.length)%all.length]);return out}
  const out=[];for(let i=0;i<Math.min(3,cats.length);i++){const c=cats[((n+i)%cats.length+cats.length)%cats.length],list=all.filter(q=>q.c===c);out.push(list[((n%list.length)+list.length)%list.length])}return out}

/* ---------- paper details from arXiv / DOI ---------- */
let fetchingPaper=null;
function paperIds(s){s=String(s||'');const a=s.match(/arxiv\.org\/(?:abs|pdf|html)\/([a-z\-]+(?:\.[a-z]{2})?\/\d{7}|\d{4}\.\d{4,5})/i)||s.match(/^\s*(?:arxiv:\s*)?(\d{4}\.\d{4,5})(?:v\d+)?\s*$/i);const d=s.match(/(10\.\d{4,9}\/[^\s?#]+)/);return {arxiv:a?a[1]:null,doi:!a&&d?d[1].replace(/[.,;]+$/,''):null}}
const cleanTxt=x=>String(x||'').replace(/\s+/g,' ').trim();
const authorList=a=>{a=a.filter(Boolean);return a.length>6?a.slice(0,6).join(', ')+' et al.':a.join(', ')};
async function fetchMeta(src){const {arxiv,doi}=paperIds(src);if(!arxiv&&!doi)return null;const tries=[];
  if(arxiv)tries.push(async()=>{const r=await fetch('https://export.arxiv.org/api/query?id_list='+encodeURIComponent(arxiv));if(!r.ok)throw 0;const x=new DOMParser().parseFromString(await r.text(),'application/xml'),e=x.getElementsByTagName('entry')[0];if(!e)throw 0;const g=t=>e.getElementsByTagName(t)[0]?.textContent||'',title=cleanTxt(g('title'));if(!title||/^error$/i.test(title))throw 0;
    return {title,authors:authorList([...e.getElementsByTagName('author')].map(a=>cleanTxt(a.getElementsByTagName('name')[0]?.textContent))),year:g('published').slice(0,4),abstract:cleanTxt(g('summary'))}});
  tries.push(async()=>{const r=await fetch('https://api.semanticscholar.org/graph/v1/paper/'+encodeURIComponent(arxiv?'arXiv:'+arxiv:'DOI:'+doi)+'?fields=title,authors,year,abstract');if(!r.ok)throw 0;const j=await r.json();if(!j.title)throw 0;
    return {title:cleanTxt(j.title),authors:authorList((j.authors||[]).map(a=>a.name)),year:j.year?String(j.year):'',abstract:cleanTxt(j.abstract)}});
  if(doi)tries.push(async()=>{const r=await fetch('https://api.crossref.org/works/'+encodeURIComponent(doi));if(!r.ok)throw 0;const m=(await r.json()).message||{},title=cleanTxt((m.title||[])[0]);if(!title)throw 0;
    return {title,authors:authorList((m.author||[]).map(a=>cleanTxt((a.given||'')+' '+(a.family||'')))),year:String((((m.issued||{})['date-parts']||[[]])[0]||[])[0]||''),abstract:cleanTxt(String(m.abstract||'').replace(/<[^>]+>/g,' '))}});
  for(const t of tries){try{return await t()}catch{}}return null}
async function fillMeta(p,o={}){const src=p.url||p.title,ids=paperIds(src);
  if(!ids.arxiv&&!ids.doi){if(!o.quiet)notify('Add an arXiv or DOI link under Details to fetch the paper’s details.');return}
  if(typeof syncView!=='function'){notify('Automatic titles only work in the GitHub version of the page. Type the title under Details.');return}
  fetchingPaper=p.id;softRender();const m=await fetchMeta(src);fetchingPaper=null;
  if(!m){notify('Could not reach arXiv or the paper databases. Type the title under Details.');softRender();return}
  const linkTitle=!p.title||p.title===p.url||/^https?:\/\//i.test(p.title)||/^(arxiv:\s*)?\d{4}\.\d{4,5}/i.test(p.title);
  if(o.overwrite||linkTitle)p.title=m.title;if(m.authors&&(o.overwrite||!p.authors))p.authors=m.authors;if(m.year&&(o.overwrite||!p.year))p.year=m.year;if(m.abstract&&(o.overwrite||!p.abstract))p.abstract=m.abstract;
  if(!p.url)p.url=ids.arxiv?'https://arxiv.org/abs/'+ids.arxiv:'https://doi.org/'+ids.doi;
  commit([P(p.id)]);softRender();notify('Found: '+short(m.title))}

function chime(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const t=audio.currentTime;[660,880].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0,t+i*.25);g.gain.linearRampToValueAtTime(.18,t+i*.25+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*.25+.9);o.connect(g).connect(audio.destination);o.start(t+i*.25);o.stop(t+i*.25+1)})}catch{}}
function syncAck(){const r=state.running,iv=state.settings.checkIn*60000;ackCount=r&&iv?Math.floor((Date.now()-r.start)/iv):0;chimed=ackCount}
setInterval(()=>{const r=state.running;if(!r)return;const el=Date.now()-r.start;if($('focusClock'))$('focusClock').textContent=clock(el);
  const iv=state.settings.checkIn*60000;if(iv){const due=Math.floor(el/iv);if(due>ackCount&&due>chimed){chimed=due;chime();if(tab==='today')softRender();else notify(dur(due*iv)+' of focus. Time to check in.')}}},1000);

  case 'edit-motto':edit={kind:'motto',id:'x'};render();$('mottoInput')?.focus();break;
  case 'pick-motto':{const i=$('mottoInput');if(i){i.value=d.text;i.focus()}break}
  case 'save-motto':{const v=$('mottoInput')?.value.trim();if(v){state.settings.motto=v;commit(['main'])}edit=null;render();break}
  case 'quotes-builtin':delete state.settings.fileQuotes;delete state.settings.quotesSource;quoteOverride=null;commit(['main']);render();notify('Back to the built-in quotes.');break;
  case 'add-paper':{let ti=$('newPaperTitle')?.value.trim(),u=$('newPaperUrl')?.value.trim();if(!ti&&!u){notify('Add a title or a link first.');break}const ti2=paperIds(ti);if(ti&&!u&&(/^https?:\/\//i.test(ti)||ti2.arxiv||ti2.doi)){u=/^https?:\/\//i.test(ti)?ti:ti2.arxiv?'https://arxiv.org/abs/'+ti2.arxiv:'https://doi.org/'+ti2.doi;ti=''}const p=newPaper(ti||u,u);state.papers.unshift(p);openPaper=p.id;logAuto('Added paper · '+short(p.title));commit([P(p.id)]);render();window.scrollTo(0,0);const ids=paperIds(u||ti);if(ids.arxiv||ids.doi)fillMeta(p,{quiet:true});break}
  case 'fetch-meta':{const p=paper(d.id);if(p)fillMeta(p,{overwrite:true});break}
  case 'pfilter':paperFilter=d.k;render();break;
  case 'ptag':paperTag=paperTag===d.k?'':d.k;render();break;
  case 'open-paper':tab='library';openPaper=d.id;edit=null;confirmDel=null;render();window.scrollTo(0,0);break;
  case 'close-paper':openPaper=null;confirmDel=null;render();break;
  case 'rate':{const p=paper(d.id),n=+d.n;if(p){p.rating=p.rating===n?0:n;commit([P(p.id)]);render()}break}
  case 'export-paper':{const p=paper(d.id);if(p)downloadText((p.title.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase().slice(0,60)||'paper')+'.md',paperMd(p));break}
  case 'read-start':{const p=paper(d.id);if(!p||state.running)break;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch{}state.running={start:Date.now(),taskId:null,paperId:p.id,note:''};ackCount=0;chimed=0;if(p.status==='queue')p.status='reading';logAuto('Started reading · '+short(p.title));commit(['main',P(p.id)]);render();break}
  case 'add-q':{const p=paper(d.id),v=$('newQ')?.value.trim();if(p&&v){p.questions.push({id:uid(),text:v,answer:'',done:false});commit([P(p.id)]);render();$('newQ')?.focus()}break}
  case 'go-mode':setMode(d.to);break;
  case 'goto-time':tab='time';render();break;
  case 'add-log':{const dk=$('logDate').value||k,min=Math.round(+$('logMin').value);if(!(min>0&&min<=720)){notify('Enter minutes between 1 and 720.');break}if(dk>k){notify('Pick today or an earlier date.');break}
    const base=parseKey(dk);base.setHours(12,0,0,0);const start=dk===k?Date.now()-min*60000:base.getTime();
    day(dk).sessions.push({id:uid(),taskId:$('logTask').value,start,end:start+min*60000,ms:min*60000,note:$('logNote').value.trim(),manual:true});day(dk).sessions.sort((a,b)=>a.start-b.start);
    logDay=dk;commit([D(dk)]);render();notify('Logged '+dur(min*60000)+' on '+prettyDay(dk)+'.');break}
  case 'jday':journalDate=d.date;render();break;case 'jtoday':journalDate=k;render();break;
  case 'unprio':{const w=week(d.week);w.priorities=w.priorities.filter(x=>x!==d.id);commit(['main']);render();break}
  case 'carry':{const w=week(d.week),mon=addDays(mondayOf(new Date()),weekOff*7),prev=state.weeks[weekKey(addDays(mon,-7))];(prev?.priorities||[]).forEach(id=>{const t=task(id);if(t&&!t.done&&!w.priorities.includes(id))w.priorities.push(id)});commit(['main']);render();break}
  }
}

/* ---------- backup ---------- */
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='research-space-backup-'+dateKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('import').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const s=normalize(JSON.parse(await f.text()));state=s;syncAck();commit(['main',...Object.keys(state.days).map(D)]);render();notify('Backup imported.')}catch{notify('That file is not a Research Space backup.')}e.target.value=''};
$('syncStatus').onclick=()=>{tab='sync';render()};

syncAck();render();initialSync();if(gh)(async()=>{try{const r=await api('');if(r.ok){repoPrivate=!!(await r.json()).private;if(tab==='sync')render()}}catch{}})();
})();
</script>
